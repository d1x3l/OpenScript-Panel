<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpenScript Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="CSInterface.js"></script>
</head>
<body>
    <div class="panel-container">
        <!-- Header: Ricerca e Tag -->
        <div class="header">
            <div class="search-row">
                <div class="search-box">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" placeholder="Cerca script...">
                </div>
                
                <div class="custom-select-wrapper">
                    <select class="dropdown" id="tagFilter"><option value="Tutti">Tutti i tag</option></select>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </div>
            </div>
            
            <div class="tabs">
                <button class="tab active">Tutti</button>
                <button class="tab">Preferiti</button>
                <button class="tab">Cronologia</button>
            </div>
        </div>

        <!-- Lista Script -->
        <div class="list-container" id="scriptList"></div>

        <!-- Footer -->
        <div class="footer">
            <div class="tools-left">
                <button class="tool-btn" id="btn-add" title="Aggiungi nuovo script">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button class="tool-btn" id="btn-folder" title="Nuova cartella virtuale">
    <svg viewBox="0 0 24 24">
        <!-- Sagoma della cartella -->
        <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
        <!-- Simbolo "+" corretto e centrato geometricamente -->
        <path d="M11 14h-3v-2h3V9h2v3h3v2h-3v3h-2v-3z"/>
    </svg>
</button>

                <!-- Tasto Nascosti (Occhio barrato) -->
<button class="tool-btn" id="btn-hidden" title="Gestisci script nascosti">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
    </svg>
</button>

                <button class="tool-btn" id="btn-delete" title="Elimina selezionati">
                    <svg viewBox="0 0 24 24"><path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13zM9 8h2v9H9zm4 0h2v9h-2z"/></svg>
                </button>
            </div>
            <div class="tools-right">
                <button class="tool-btn" id="btn-refresh" title="Ricarica pannello">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
</button>
                <button class="tool-btn" id="btn-info" title="Info">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                </button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
